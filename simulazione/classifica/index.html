<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Classifica Live – Simulazione Gara HYROX</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}html,body{height:100%;margin:0;background:#0A0A0A;overflow:hidden}
  /* ===== LEDWALL (stile Challenge HYROX) ===== */
  .lw{--k:#0A0A0A;--y:#FFDD00;--g2:#C9CCD3;--ln:#232323;height:100vh;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--k);color:#fff;font-family:Barlow,system-ui,sans-serif;cursor:default}
  .lw .cd{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase}
  .lw .stripes{position:absolute;inset:0;pointer-events:none;opacity:.05;background:repeating-linear-gradient(-60deg,transparent 0 2.2vw,var(--y) 2.2vw 3vw)}
  .lw .top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1.2vh 2.2vw;border-bottom:.5vh solid var(--y);background:#000}
  .lw .brand{display:flex;align-items:center;gap:1.6vw}
  .lw .brand img{height:8.5vh}
  .lw .brand .sep{display:block;width:2px;height:8vh;background:#444}
  .lw .ctr{text-align:center;min-width:34vw}
  .lw .phase{display:inline-block;font-weight:900;font-size:3.6vh;letter-spacing:1vh;padding:.2vh 2vw;background:var(--y);color:var(--k);transform:skewX(-12deg)}
  .lw .phase span{display:inline-block;transform:skewX(12deg)}
  .lw .clk{font-weight:800;font-size:13vh;line-height:.95;letter-spacing:.4vh;font-variant-numeric:tabular-nums;color:var(--y)}
  .lw .meta{display:flex;flex-direction:column;align-items:flex-end;gap:.6vh;text-align:right}
  .lw .meta .t1{font-weight:800;font-size:3.4vh;letter-spacing:.35vh;line-height:1;color:var(--y)}
  .lw .meta .arr{white-space:nowrap;font-weight:800;font-size:5.5vh;line-height:1}
  .lw .meta .arr small{font-size:2.6vh;color:var(--g2);letter-spacing:.4vh;margin-right:.6vw}
  .lw .meta .t3{white-space:nowrap;font-weight:600;font-size:2.4vh;color:var(--g2);letter-spacing:.3vh}
  .lw .boards{position:relative;flex:1;display:grid;gap:2vw;padding:1.6vh 2.2vw 2.6vh;min-height:0}
  .lw .board{display:flex;flex-direction:column;min-height:0}
  .lw .bhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:.35vh solid var(--y);padding-bottom:.6vh;margin-bottom:.6vh}
  .lw .bhead h2{font-weight:900;font-size:4.6vh;letter-spacing:.6vh;line-height:1}
  .lw .bhead .rng{font-weight:700;font-size:2.4vh;letter-spacing:.3vh;color:var(--g2)}
  .lw .rows{flex:1;display:grid;grid-template-rows:repeat(15,1fr);min-height:0}
  .lw .row{display:grid;grid-template-columns:7vh 1fr auto;align-items:center;gap:1vw;border-bottom:1px solid var(--ln);padding:0 .8vw;min-height:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:2.9vh;line-height:1;text-transform:uppercase}
  .lw .row .pos{font-weight:800;color:var(--g2);font-variant-numeric:tabular-nums}
  .lw .row .nm{font-size:1em;color:inherit;font-weight:700;letter-spacing:.15vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lw .row .nm small{font-size:.75em;color:var(--g2);font-weight:600;margin-right:.6vw}
  .lw .row .tm{font-weight:800;font-variant-numeric:tabular-nums;color:var(--y)}
  .lw .row.top2{background:var(--y);color:var(--k);border-bottom:2px solid var(--k)}
  .lw .row.top2 .pos,.lw .row.top2 .tm,.lw .row.top2 .nm small{color:var(--k)}
  .lw .row.run .nm{color:#8a8f98}
  .lw .board.live .row.run .nm{color:#fff}
  .lw .board.live .bhead{border-bottom-color:#fff}
  .lw .row.run .tm{color:#fff;font-weight:600}
  .lw .row.run .pos{color:var(--y);font-size:.7em;animation:bl 1.2s infinite}
  @keyframes bl{50%{opacity:.15}}
  .lw .row.empty .nm{color:#333}
  .lw .row.new{animation:nw 1s ease-in-out 6}
  @keyframes nw{50%{background:rgba(255,221,0,.45)}}
  .lw .rows.fade .row:not(.fix){opacity:0;transform:translateX(-1.5vw)}
  .lw .rows .row{transition:opacity .45s ease,transform .45s ease}
  .lw .dots{display:flex;gap:.5vw;justify-content:center;padding-top:.6vh;min-height:1.2vh}
  .lw .dots i{width:2.2vw;height:.6vh;background:#333}
  .lw .dots i.on{background:var(--y)}
  .lw .strip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:2vw;background:var(--y);color:var(--k);padding:1vh 2.2vw;height:15vh;flex:0 0 auto}
  .lw .strip .sbig{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:900;font-size:5vh;letter-spacing:.3vh;line-height:1}
  .lw .strip .small{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.6vh;letter-spacing:.3vh;margin-top:.6vh}
  .lw .strip .qrbox{background:#fff;padding:.7vh;height:13vh;width:13vh;display:flex;align-items:center;justify-content:center}
  .lw .strip .qrbox svg{width:100%;height:100%}
  .lw .strip .right{display:flex;align-items:center;gap:1.5vw}
  .lw .strip .arrow{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:900;font-size:7vh}
  .lw .disc{position:absolute;right:2.2vw;bottom:15.6vh;font-size:1.3vh;color:#555;letter-spacing:.1vh}
  .lw .st{position:absolute;left:2.2vw;bottom:15.6vh;font-size:1.3vh;color:#777}
  .lw .ctrl{position:absolute;left:50%;top:22vh;transform:translateX(-50%);background:rgba(20,20,20,.96);border:1px solid #333;padding:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:5;opacity:0;pointer-events:none;transition:opacity .3s}
  .lw .ctrl.show{opacity:1;pointer-events:auto}
  .lw .ctrl button{background:#222;color:#fff;border:1px solid #444;padding:14px 20px;font-size:18px;font-weight:700;font-family:"Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase}
  .lw .ctrl button.pri{background:var(--y);color:var(--k);border-color:var(--y)}
</style>
</head>

<script>
/* Classifica pubblica per OptiSigns. Legge dati.json (aggiornato dalle attività pianificate) ogni 20 s. */
let S={athletes:{},names:{},sex:{},title:''};let upd='';let loaded=false;
const $=id=>document.getElementById(id);
const pad2=n=>String(n).padStart(2,'0');
function dur(ms){if(ms<0)ms=0;const t=Math.floor(ms/100),ds=t%10,s=Math.floor(t/10)%60,m=Math.floor(t/600)%60,h=Math.floor(t/36000);return (h?h+':':'')+pad2(m)+':'+pad2(s)+'.'+ds}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=n=>S.names[n]||'';
const sx=n=>S.sex[n]||'';
function ranking(filter){
  const ids=Object.keys(S.athletes).map(Number).filter(i=>S.athletes[i]&&S.athletes[i].start&&(filter===undefined||sx(i)===filter));
  const fin=ids.filter(i=>S.athletes[i].finish).sort((a,b)=>(S.athletes[a].finish-S.athletes[a].start)-(S.athletes[b].finish-S.athletes[b].start));
  const run=ids.filter(i=>!S.athletes[i].finish).sort((a,b)=>S.athletes[a].start-S.athletes[b].start);
  return {fin,run};
}
const seenFinish={};let firstLed=true;const lwPage={};
function boardRows(g,now){
  // g.list: [{i,f}] ; g.fixed: numero di posizioni fisse in cima (2 per MEN/WOMEN, 0 per IN GARA)
  const nFix=g.fixed, per=15-nFix;
  const fixed=g.list.slice(0,nFix), rest=g.list.slice(nFix);
  const pages=Math.max(1,Math.ceil(rest.length/per));
  let pg=lwPage[g.k]||0; if(pg>=pages)pg=0; lwPage[g.k]=pg;
  const slice=rest.slice(pg*per,pg*per+per);
  const name=i=>`<small>${i}</small>${esc(nm(i))||'ATLETA '+i}`;
  const isNew=i=>seenFinish[i]&&seenFinish[i]!==1&&now-seenFinish[i]<8000;
  const row=(o,pos,cls)=>{const i=o.i,a=S.athletes[i];
    return o.f?`<div class="row ${cls} ${isNew(i)?'new':''}"><div class="pos">${pos}</div><div class="nm">${name(i)}</div><div class="tm">${dur(a.finish-a.start)}</div></div>`
              :`<div class="row run ${cls}"><div class="pos">●</div><div class="nm">${name(i)}</div><div class="tm" data-run="${a.start}"></div></div>`};
  let h='';
  for(let k=0;k<nFix;k++){const o=fixed[k];
    h+=o?row(o,k+1,'top2 fix'):`<div class="row empty fix"><div class="pos">${k+1}</div><div class="nm">—</div><div class="tm"></div></div>`}
  slice.forEach((o,idx)=>{h+=row(o,nFix+pg*per+idx+1,'')});
  for(let k=slice.length;k<per;k++)h+=`<div class="row empty"><div class="pos"></div><div class="nm"></div><div class="tm"></div></div>`;
  let rng='';
  if(g.k==='R')rng=g.list.length?`${g.list.length} ATLETI`:'';
  else if(rest.length){const from=pg*per+nFix+1,to=Math.min(pg*per+per,rest.length)+nFix;rng=`POS. ${from}–${to}`}
  const dots=pages>1?Array.from({length:pages},(_,k)=>`<i class="${k===pg?'on':''}"></i>`).join(''):'';
  return {h,rng,dots};
}
function renderLed(){
  $('lwTitle').textContent=S.title||'SIMULAZIONE GARA HYROX';
  const now=Date.now();
  Object.keys(S.athletes).forEach(i=>{if(S.athletes[i].finish&&!seenFinish[i])seenFinish[i]=firstLed?1:now});
  Object.keys(seenFinish).forEach(i=>{if(!S.athletes[i]||!S.athletes[i].finish)delete seenFinish[i]});
  const all=ranking();
  // MEN / WOMEN: solo tempi definitivi (arrivati). IN GARA: tutti gli atleti in corsa, senza distinzione di sesso
  const finNoSex=all.fin.filter(i=>!sx(i));
  const groups=[
    {k:'M',t:'MEN',fixed:2,list:ranking('M').fin.map(i=>({i,f:1}))},
    {k:'F',t:'WOMEN',fixed:2,list:ranking('F').fin.map(i=>({i,f:1}))},
    {k:'R',t:'IN GARA',fixed:0,list:[...all.run.map(i=>({i,f:0})),...finNoSex.map(i=>({i,f:1}))]}
  ];
  $('lwBoards').style.gridTemplateColumns='1fr 1fr 1fr';
  $('lwBoards').innerHTML=groups.map(g=>{const b=boardRows(g,now);
    return `<div class="board ${g.k==='R'?'live':''}"><div class="bhead cd"><h2>${g.t}</h2><div class="rng">${b.rng}</div></div><div class="rows" data-b="${g.k}">${b.h}</div><div class="dots">${b.dots}</div></div>`}).join('');
  firstLed=false;
  $('lwArr').textContent=all.fin.length;
  $('lwRun').textContent=`IN GARA ${all.run.length} · PARTITI ${all.fin.length+all.run.length}`;
  $('lwSync').textContent=upd?'Aggiornato alle '+upd:'';
}
setInterval(()=>{
  document.querySelectorAll('#lwBoards .rows').forEach(r=>r.classList.add('fade'));
  setTimeout(()=>{['M','F','R'].forEach(k=>lwPage[k]=(lwPage[k]||0)+1);renderLed()},450)},15000);
async function load(){
  try{const r=await fetch('dati.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();
    S={athletes:d.athletes||{},names:d.names||{},sex:d.sex||{},title:d.title||''};upd=d.updated||'';if(!loaded){firstLed=true;loaded=true}renderLed()}catch(e){}
}
function tick(){const n=Date.now(),d=new Date(n);
  $('lwClock').textContent=pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
  document.querySelectorAll('[data-run]').forEach(el=>el.textContent=dur(n-Number(el.dataset.run)));
  setTimeout(tick,200)}
window.addEventListener('resize',renderLed);
$('vLed').classList.remove('hide');renderLed();load();setInterval(load,20000);tick();
</script>
