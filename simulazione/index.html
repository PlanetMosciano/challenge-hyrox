<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share your Race – Simulazione Gara HYROX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--k:#0A0A0A;--y:#FFDD00;--w:#FFFFFF;--g:#6A7079;--g2:#C9CCD3;--bc:"Barlow Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--k);color:var(--w);font-family:Barlow,system-ui,sans-serif;color-scheme:dark}
main{max-width:520px;margin:0 auto;padding:18px 16px 50px}
.hero{text-align:center;padding:10px 0 18px}
.hlogos{display:flex;align-items:center;justify-content:center;gap:16px}
.hlogos img{height:58px}
.hlogos i{width:2px;height:52px;background:#444}
.hero .ey{font-family:var(--bc);font-weight:700;font-size:15px;letter-spacing:4px;color:var(--y);margin-top:18px}
.hero h1{font-family:var(--bc);font-weight:900;font-size:40px;letter-spacing:2px;line-height:1;margin-top:4px;text-transform:uppercase}
.hero p{color:var(--g2);font-size:15px;margin-top:8px}
.card{background:#141414;border:1px solid #262626;padding:16px;margin-bottom:16px}
label.l{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--g2);margin:12px 0 6px;text-transform:uppercase}
input{width:100%;background:#0b0b0b;border:1px solid #333;color:#fff;font-size:18px;padding:12px;font-family:inherit;border-radius:0}
input:focus,button:focus-visible{outline:2px solid var(--y);border-color:var(--y)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:14px;font-size:18px;font-weight:800;background:#0b0b0b;color:#fff;border:1px solid #333;font-family:var(--bc);letter-spacing:2px;cursor:pointer}
.seg button.on{background:var(--y);color:var(--k);border-color:var(--y)}
.am{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.am label{font-size:11px;color:var(--g2);text-align:center;letter-spacing:1px;font-family:var(--bc);font-weight:700}
.am input{text-align:center;padding:10px 4px;font-family:var(--bc);font-weight:700;font-size:20px;margin-top:4px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid #262626}
.tot span{font-size:12px;letter-spacing:1px;color:var(--g2);text-transform:uppercase;font-weight:700}
.tot b{font-family:var(--bc);font-size:36px;color:var(--y)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:16px;margin-top:16px;background:var(--y);color:var(--k);border:0;font-family:var(--bc);font-weight:900;font-size:22px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border:1px solid #444;font-size:16px;padding:12px}
.note{font-size:13px;color:var(--g2);line-height:1.45}
.msg{margin-top:10px;font-size:14px;color:#FF6B6B;min-height:18px}
#outImg{width:100%;display:block;border:1px solid #333}
.list{margin-top:10px;max-height:58vh;overflow:auto;border:1px solid #262626}
.list button{display:grid;grid-template-columns:44px 1fr auto;width:100%;text-align:left;background:#111;border:0;border-bottom:1px solid #222;color:#fff;padding:13px 12px;font-size:16px;align-items:center;cursor:pointer;font-family:inherit}
.list button b{font-family:var(--bc);color:var(--g2);font-size:19px}
.list button span{font-weight:600}
.list button em{font-style:normal;font-family:var(--bc);font-weight:800;color:var(--y);font-size:21px}
.list .empty{padding:16px;color:var(--g2);font-size:14px}
.hidden{display:none!important}
.disc{text-align:center;font-size:11px;color:#555;margin-top:24px}
</style>
</head>

const r1=x=>Math.round(x*10)/10;
const fmtPts=x=>Number.isInteger(r1(x))?String(r1(x)):r1(x).toFixed(1).replace(".",",");
const num=v=>{ if(v===""||v==null) return null; const n=Number(String(v).replace(",",".")); return isFinite(n)&&n>=0?n:NaN; };
/* ---- tempi pubblicati: {name, sex U/D, ms} ---- */
let R={athletes:[],event:{},updated:null};
try{ R=Object.assign(R, JSON.parse(document.getElementById("results").textContent)); }catch(e){}
const p2=n=>String(n).padStart(2,"0");
function fmtTime(ms){ const t=Math.floor(ms/100), ds=t%10, s=Math.floor(t/10)%60, m=Math.floor(t/600)%60, h=Math.floor(t/36000);
  return (h?h+":"+p2(m):p2(m))+":"+p2(s)+"."+ds; }
function listFor(sx){ return (R.athletes||[]).filter(a=>a&&a.sex===sx&&typeof a.name==="string"&&typeof a.ms==="number"&&isFinite(a.ms)&&a.ms>0)
  .map(a=>({name:a.name.slice(0,40),sex:sx,ms:a.ms})).sort((a,b)=>a.name.localeCompare(b.name,"it")); }
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pSex="U";
$$("#pSex button").forEach(b=>b.onclick=()=>{ pSex=b.dataset.v; $$("#pSex button").forEach(x=>x.classList.toggle("on",x===b)); renderPick(); });
$("#pSearch").oninput=renderPick;
function renderPick(){
  const q=$("#pSearch").value.trim().toLowerCase(), list=listFor(pSex).filter(a=>!q||a.name.toLowerCase().includes(q));
  $("#pList").innerHTML = list.length ? list.map((a,i)=>`<button data-i="${i}" style="grid-template-columns:1fr auto"><span>${esc(a.name)}</span><em>${fmtTime(a.ms)}</em></button>`).join("")
    : `<div class="empty">${(R.athletes||[]).length?"Nessun nome trovato.":"I risultati non sono ancora pubblicati: riprova tra qualche minuto."}</div>`;
  $$("#pList button").forEach(b=>b.onclick=()=>{ const a=list[+b.dataset.i]; makeGraphic({name:a.name,sex:a.sex,ms:a.ms,date:R.event&&R.event.date}); });
  $("#pUpd").textContent = R.updated ? "Risultati aggiornati al "+R.updated : "";
}
renderPick();
$("#back").onclick=()=>{ $("#out").classList.add("hidden"); $("#pick").classList.remove("hidden"); };

const GX_TITLE=()=>"Simulazione Gara HYROX", GX_DATE=a=>a.date||today();
async function makeGraphic(a){
  try{ await Promise.all([document.fonts.load('900 100px "Barlow Condensed"'),document.fonts.load('700 100px "Barlow Condensed"'),document.fonts.load('500 30px Barlow')]); }catch(e){}
  for(const im of [GX_H,GX_P,GX_BG]) if(!im.complete) await new Promise(r=>{im.onload=r;im.onerror=r;});
  const W=1080,H=1920,c=document.createElement("canvas"); c.width=W;c.height=H; const x=c.getContext("2d");
  const BC='"Barlow Condensed","Arial Narrow",sans-serif';
  x.fillStyle="#0A0A0A"; x.fillRect(0,0,W,H);
  if(GX_BG.naturalWidth){ x.drawImage(GX_BG,0,0,W,H); }
  x.fillStyle="rgba(8,8,10,0.62)"; x.fillRect(0,0,W,H);
  let g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"rgba(0,0,0,0.55)"); g.addColorStop(0.28,"rgba(0,0,0,0.05)"); g.addColorStop(0.6,"rgba(0,0,0,0.15)"); g.addColorStop(1,"rgba(0,0,0,0.75)");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle="#FFDD00";
  for(let i=0;i<4;i++){ const y=1700+i*46; x.beginPath(); x.moveTo(440,y); x.lineTo(W+300,y); x.lineTo(W+270,y+24); x.lineTo(410,y+24); x.closePath(); x.fill(); }
  // Planet Fitness in evidenza, HYROX più piccolo sotto
  const pw=640, ph=pw*GX_P.height/GX_P.width; x.drawImage(GX_P,(W-pw)/2,100,pw,ph);
  const hh=74, hw=hh*GX_H.width/GX_H.height; const hy=100+ph+44;
  x.fillStyle="rgba(255,255,255,0.35)"; x.fillRect(W/2-150,hy-22,300,2);
  x.drawImage(GX_H,(W-hw)/2,hy,hw,hh);
  x.textAlign="center";
  x.font=`800 56px ${BC}`; x.fillStyle="#FFFFFF"; x.letterSpacing="10px"; x.fillText(GX_TITLE().toUpperCase(), W/2, hy+hh+90);
  x.font=`600 30px ${BC}`; x.fillStyle="#C9CCD3"; x.letterSpacing="8px"; x.fillText("MOSCIANO"+(GX_DATE(a)?"  ·  "+GX_DATE(a):""), W/2, hy+hh+140);
  const nm=a.name.toUpperCase(); let fs=130; x.letterSpacing="2px";
  do{ x.font=`900 ${fs}px ${BC}`; fs-=6; }while(x.measureText(nm).width>W-120 && fs>60);
  x.fillStyle="#FFFFFF"; x.fillText(nm, W/2, 800);
  x.font=`700 40px ${BC}`; x.fillStyle="#C9CCD3"; x.letterSpacing="14px"; x.fillText("MY TIME", W/2, 890);
  const tt=fmtTime(a.ms); let ts=250; x.letterSpacing="4px";
  do{ x.font=`900 ${ts}px ${BC}`; ts-=8; }while(x.measureText(tt).width>W-100 && ts>120);
  x.fillStyle="#FFDD00"; x.fillText(tt, W/2, 1130);
  let y=1300;
  const div = a.sex==="D" ? "WOMEN" : "MEN";
  const txt = `${div} DIVISION`;
  x.font=`800 54px ${BC}`; x.letterSpacing="6px"; const tw=x.measureText(txt).width+80;
  x.save(); x.translate(W/2,y); x.transform(1,0,-.2,1,0,0); x.fillStyle="#FFFFFF"; x.fillRect(-tw/2,-54,tw,78); x.restore();
  x.fillStyle="#0A0A0A"; x.fillText(txt, W/2, y);
  x.font=`800 42px ${BC}`; x.fillStyle="#FFFFFF"; x.letterSpacing="10px"; x.fillText("ARE YOU READY?", W/2, 1650);
  x.font='500 22px Barlow,sans-serif'; x.fillStyle="#8A9099"; x.letterSpacing="1px";
  x.fillText("Evento del club, non è una gara ufficiale HYROX", W/2, H-36);
  $("#outImg").src=c.toDataURL("image/jpeg",0.9);
  $("#pick").classList.add("hidden"); $("#out").classList.remove("hidden"); scrollTo({top:0});
}
